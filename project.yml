    resources:
      - path: CoreAIOnDeviceLAS/PrivacyInfo.xcprivacy
      - path: CoreAIOnDeviceLAS/Assets.xcassets
    info:
      path: CoreAIOnDeviceLAS/Info.plist
      properties:
        CFBundleDisplayName: "Core AI: LAS"
        CFBundleShortVersionString: "3.2.6"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Core AI: LAS exposes your selected on-device Core AI model to trusted computers on your local network."
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesutcydev.coreaiondevicelas
        INFOPLIST_FILE: CoreAIOnDeviceLAS/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoreAIOnDeviceLAS/CoreAIOnDeviceLAS.entitlements
        CODE_SIGN_STYLE: Automatic
        VERSIONING_SYSTEM: apple-generic
        CURRENT_PROJECT_VERSION: "138"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_TESTABILITY: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CORE_AI_SERVER_APP"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - package: coreai-models
        product: CoreAILM
      - package: coreai-models
        product: CoreAISegmentation

  CoreAIOnDeviceLASTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: IOSLocalLLMTests/CoreAIModelStoreTests.swift
    dependencies:
      - target: CoreAIOnDeviceLAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesutcydev.coreaiondevicelas.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""

schemes:
  SanadAI:
    build:
      targets:
        SanadAI: all
        SanadAITests: [test]
    test:
      config: Debug
      targets:
        - SanadAITests
    archive:
      config: Release

  OnDeviceLAS:
    build:
      targets:
        OnDeviceLAS: all
        OnDeviceLASTests: [test]
    test:
      config: Debug
      targets:
        - OnDeviceLASTests
    archive:
      config: Release

  CoreAIOnDeviceLAS:
    build:
      targets:
        CoreAIOnDeviceLAS: all
    test:
      config: Debug
      targets:
        - CoreAIOnDeviceLASTests
    archive:
      config: Release
